name: Intranet availability (manual diagnostic)
on:
  # The dashboard now checks Infomaniak directly; GitHub is no longer a scheduler.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intranet-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the intranet web entry point
        run: node scripts/check-intranet.mjs
